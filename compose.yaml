services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bnb_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bnb_agents"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - bnb_agents_postgres:/var/lib/postgresql/data

volumes:
  bnb_agents_postgres:
